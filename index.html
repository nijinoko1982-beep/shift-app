<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="シフト提出">
<title>シフト希望提出</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
:root {
  --bg: #F0F4F8; --surface: #fff; --primary: #2563EB;
  --primary-light: #DBEAFE; --text: #1E293B; --text-sub: #64748B;
  --border: #E2E8F0; --radius: 12px; --shadow: 0 2px 12px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 40px; }
.header { background: var(--primary); color: white; padding: 18px 16px 14px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(37,99,235,.3); }
.header h1 { font-size: 17px; font-weight: 700; }
.header p { font-size: 11px; opacity: .8; margin-top: 2px; }
.hbtns { display: flex; gap: 8px; }
.hbtn { background: rgba(255,255,255,.2); border: none; color: white; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; }
.steps { display: flex; padding: 16px; }
.step { display: flex; flex-direction: column; align-items: center; flex: 1; position: relative; }
.step:not(:last-child)::after { content: ''; position: absolute; top: 14px; left: 50%; width: 100%; height: 2px; background: var(--border); z-index: 0; }
.step.done:not(:last-child)::after { background: var(--primary); }
.snum { width: 28px; height: 28px; border-radius: 50%; background: var(--border); color: var(--text-sub); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; position: relative; z-index: 1; }
.step.active .snum { background: var(--primary); color: white; }
.step.done .snum { background: #10B981; color: white; }
.slabel { font-size: 10px; color: var(--text-sub); margin-top: 4px; }
.step.active .slabel { color: var(--primary); font-weight: 700; }
.card { background: var(--surface); border-radius: var(--radius); padding: 16px; margin: 0 16px 16px; box-shadow: var(--shadow); }
.ctitle { font-size: 14px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.month-nav { display: flex; align-items: center; justify-content: space-between; }
.month-nav button { background: none; border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; color: var(--primary); }
.mlabel { font-size: 16px; font-weight: 700; }
.cal-header { display: grid; grid-template-columns: repeat(7,1fr); text-align: center; margin-bottom: 4px; }
.cal-header span { font-size: 11px; font-weight: 700; color: var(--text-sub); padding: 4px 0; }
.cal-header span:first-child { color: #EF4444; }
.cal-header span:last-child { color: #3B82F6; }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }
.cday { aspect-ratio: 1; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; cursor: pointer; position: relative; border: 2px solid transparent; transition: all .15s; }
.cday.sun { color: #EF4444; }
.cday.sat { color: #3B82F6; }
.cday.today { background: #FEF3C7; }
.cday.has-shift { border-color: var(--primary); background: var(--primary-light); }
.cday .dot { width: 4px; height: 4px; border-radius: 50%; position: absolute; bottom: 3px; }
.chip { padding: 8px 14px; border-radius: 20px; border: 2px solid var(--border); font-size: 13px; font-weight: 500; cursor: pointer; background: white; transition: all .15s; display: inline-block; margin: 3px; }
.chip.active { border-color: var(--primary); background: var(--primary); color: white; }
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 200; align-items: flex-end; }
.overlay.show { display: flex; }
.sheet { background: var(--surface); border-radius: 20px 20px 0 0; width: 100%; padding: 0 0 32px; max-height: 85vh; overflow-y: auto; animation: slideUp .3s cubic-bezier(.34,1.56,.64,1); }
@keyframes slideUp { from { transform: translateY(100%) } to { transform: translateY(0) } }
.shandle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 0; }
.stitle { font-size: 16px; font-weight: 700; padding: 16px 20px 0; color: var(--primary); }
.ssub { font-size: 12px; color: var(--text-sub); padding: 2px 20px 0; }
.ssec { padding: 16px 20px 0; }
.ssec label { font-size: 12px; font-weight: 700; color: var(--text-sub); display: block; margin-bottom: 8px; letter-spacing: .05em; }
.tdisp { padding: 10px 14px; background: var(--primary-light); border-radius: 10px; font-size: 14px; font-weight: 700; color: var(--primary); min-height: 40px; display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
.note-input { width: 100%; padding: 10px 14px; border: 2px solid var(--border); border-radius: 10px; font-family: inherit; font-size: 14px; resize: none; outline: none; }
.note-input:focus { border-color: var(--primary); }
.sactions { display: flex; gap: 10px; padding: 20px 20px 0; }
.btn { flex: 1; padding: 14px; border-radius: 12px; border: none; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
.btn-primary { background: var(--primary); color: white; }
.btn-danger { background: #FEE2E2; color: #EF4444; }
.btn-cancel { background: var(--bg); color: var(--text-sub); }
.sitem { display: flex; align-items: center; padding: 10px 12px; background: var(--bg); border-radius: 10px; margin-bottom: 6px; gap: 10px; }
.sdate { font-size: 13px; font-weight: 700; color: var(--primary); min-width: 50px; }
.sinfo { flex: 1; }
.sname { font-size: 13px; font-weight: 700; }
.stime { font-size: 11px; color: var(--text-sub); }
.sedit { background: none; border: none; color: var(--text-sub); cursor: pointer; padding: 4px; font-size: 16px; }
.empty-msg { text-align: center; padding: 24px; color: var(--text-sub); font-size: 13px; }
.btn-submit { width: 100%; padding: 16px; background: #10B981; color: white; border: none; border-radius: var(--radius); font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(16,185,129,.3); }
.btn-submit:disabled { background: var(--border); color: var(--text-sub); box-shadow: none; cursor: not-allowed; }
.complete-screen { display: none; text-align: center; padding: 60px 24px; }
.complete-screen.show { display: block; }
.complete-icon { font-size: 64px; margin-bottom: 16px; }
.complete-screen h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
.complete-screen p { color: var(--text-sub); font-size: 14px; margin-bottom: 24px; }
.btn-restart { background: var(--primary-light); color: var(--primary); border: none; border-radius: 12px; padding: 14px 32px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
#deadlineBanner { display: none; padding: 10px 16px; font-size: 13px; align-items: center; gap: 8px; }
</style>
</head>
<body>

<div class="header">
  <div style="display:flex;justify-content:space-between;align-items:flex-start">
    <div>
      <h1>📅 シフト希望提出</h1>
      <p>カレンダーをタップして希望を入力してください</p>
    </div>
    <div class="hbtns">
      <button class="hbtn" onclick="goHome()">🏠 HOME</button>
      <button class="hbtn" onclick="openAdmin()">⚙️ 管理者</button>
    </div>
  </div>
</div>

<div id="deadlineBanner"></div>

<div class="steps">
  <div class="step active" id="si1"><div class="snum">1</div><div class="slabel">名前・月</div></div>
  <div class="step" id="si2"><div class="snum">2</div><div class="slabel">シフト入力</div></div>
  <div class="step" id="si3"><div class="snum">3</div><div class="slabel">確認・提出</div></div>
</div>

<div id="main-content">

  <!-- STEP1 -->
  <div id="step1">
    <div class="card">
      <div class="ctitle">👤 あなたの名前を選んでください</div>
      <div id="staffChips" style="min-height:40px;flex-wrap:wrap;display:flex"></div>
      <input type="hidden" id="nameInput">
    </div>
    <div class="card">
      <div class="ctitle">📆 対象月</div>
      <div class="month-nav">
        <button onclick="changeMonth(-1)">‹</button>
        <span class="mlabel" id="monthLabel"></span>
        <button onclick="changeMonth(1)">›</button>
      </div>
    </div>
    <div style="padding:0 16px">
      <button class="btn-submit" onclick="goStep2()">次へ　→</button>
    </div>
  </div>

  <!-- STEP2 -->
  <div id="step2" style="display:none">
    <div class="card">
      <div class="ctitle">📅 <span id="calTitle"></span>
        <span style="background:#F59E0B;color:white;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:4px" id="badge">0日</span>
      </div>
      <div class="cal-header"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
      <div class="cal-grid" id="calGrid"></div>
      <p style="font-size:11px;color:var(--text-sub);margin-top:10px;text-align:center">💡 日付をタップしてシフトを入力</p>
    </div>
    <div class="card">
      <div class="ctitle">📋 入力済みシフト一覧</div>
      <div id="shiftList"><div class="empty-msg">まだ入力されていません</div></div>
    </div>
    <div style="display:flex;gap:10px;padding:0 16px">
      <button class="btn btn-cancel" onclick="goStep1()" style="flex:none;padding:14px 20px">← 戻る</button>
      <button class="btn-submit" style="flex:1" onclick="goStep3()">確認へ　→</button>
    </div>
  </div>

  <!-- STEP3 -->
  <div id="step3" style="display:none">
    <div class="card">
      <div class="ctitle">✅ 提出内容の確認</div>
      <div id="confirmContent"></div>
    </div>
    <div style="display:flex;gap:10px;padding:0 16px;flex-direction:column">
      <button class="btn-submit" onclick="sendToSheets()" id="sheetsBtn">📊 スプレッドシートに送信</button>
      <button class="btn-submit" onclick="downloadCSV()" style="background:#64748B;box-shadow:none">📥 CSVでダウンロード</button>
      <button class="btn btn-cancel" onclick="goStep2()" style="text-align:center">← 戻る</button>
    </div>
    <div id="sendStatus" style="margin:8px 16px 0;font-size:13px;text-align:center;min-height:20px"></div>
  </div>

  <!-- COMPLETE -->
  <div class="complete-screen" id="completeScreen">
    <div class="complete-icon">🎉</div>
    <h2 id="completeTitle">提出完了！</h2>
    <p id="completeMsg">スプレッドシートに送信されました。</p>
    <button onclick="downloadPDF()" style="display:block;width:100%;max-width:280px;margin:0 auto 12px;padding:14px;background:#2563EB;color:white;border:none;border-radius:12px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer">📄 PDF保存</button>
    <button class="btn-restart" onclick="restart()">もう一度提出する</button>
  </div>

</div>

<!-- 管理者モーダル -->
<div class="overlay" id="adminOverlay" onclick="if(event.target===this)closeAdminPanel()">
  <div class="sheet">
    <div class="shandle"></div>
    <div class="stitle">⚙️ 管理者設定</div>
    <div id="adminLogin">
      <div class="ssec">
        <label>パスワード</label>
        <input type="password" id="adminPass" style="width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:10px;font-size:16px;outline:none;font-family:inherit" placeholder="パスワードを入力">
        <button onclick="checkAdminPass()" class="btn btn-primary" style="width:100%;margin-top:10px;padding:12px">ログイン</button>
        <p style="font-size:11px;color:var(--text-sub);margin-top:8px;text-align:center">初期パスワード: admin123</p>
      </div>
    </div>
    <div id="adminPanel" style="display:none">

      <!-- 提出期限 -->
      <div class="ssec">
        <label>📅 提出期限</label>
        <div style="display:flex;gap:8px">
          <input type="date" id="deadlineInput" style="flex:1;padding:10px 14px;border:2px solid var(--border);border-radius:10px;font-size:15px;outline:none">
          <button onclick="saveDeadline()" class="btn btn-primary" style="padding:10px 16px">保存</button>
        </div>
        <div id="currentDeadline" style="font-size:12px;color:var(--text-sub);margin-top:6px"></div>
      </div>

      <!-- スタッフ管理 -->
      <div class="ssec">
        <label>👥 スタッフ一覧</label>
        <div id="adminStaffList" style="margin-bottom:10px"></div>
        <div style="display:flex;gap:8px">
          <input type="text" id="newStaffName" placeholder="名前を入力（例：200 山田 太郎）" style="flex:1;padding:10px 14px;border:2px solid var(--border);border-radius:10px;font-size:14px;outline:none;font-family:inherit">
          <button onclick="addStaff()" class="btn btn-primary" style="padding:10px 16px">追加</button>
        </div>
      </div>

      <!-- シフト管理 -->
      <div class="ssec">
        <label>🕐 シフト一覧</label>
        <div id="adminShiftList" style="margin-bottom:10px"></div>
        <div style="background:var(--bg);border-radius:10px;padding:12px">
          <input type="text" id="newShiftName" placeholder="シフト名（例：⑩特別シフト）" style="width:100%;padding:8px 12px;border:2px solid var(--border);border-radius:8px;font-size:13px;outline:none;font-family:inherit;margin-bottom:6px">
          <input type="text" id="newShiftTime" placeholder="時間帯（例：10:00〜15:00）" style="width:100%;padding:8px 12px;border:2px solid var(--border);border-radius:8px;font-size:13px;outline:none;font-family:inherit;margin-bottom:6px">
          <input type="text" id="newShiftNote" placeholder="補足（例：5時間）" style="width:100%;padding:8px 12px;border:2px solid var(--border);border-radius:8px;font-size:13px;outline:none;font-family:inherit;margin-bottom:8px">
          <button onclick="addShift()" class="btn btn-primary" style="width:100%;padding:10px">＋ シフトを追加</button>
        </div>
      </div>

      <div class="sactions">
        <button class="btn btn-cancel" onclick="closeAdminPanel()">閉じる</button>
      </div>
    </div>
  </div>
</div>

<!-- シフト入力モーダル -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeOverlay()">
  <div class="sheet">
    <div class="shandle"></div>
    <div class="stitle" id="sheetTitle"></div>
    <div class="ssub" id="sheetSub"></div>
    <div class="ssec">
      <label>シフト区分（複数選択可）</label>
      <div id="shiftChipsModal"></div>
    </div>
    <div class="ssec">
      <label>時間帯</label>
      <div class="tdisp" id="timeDisplay">シフトを選択すると表示されます</div>
    </div>
    <div class="ssec">
      <label>備考（任意）</label>
      <textarea class="note-input" id="noteInput" rows="2" placeholder="例：〇時以降希望"></textarea>
    </div>
    <div class="sactions">
      <button class="btn btn-danger" id="clearBtn" onclick="clearDay()" style="display:none">削除</button>
      <button class="btn btn-cancel" onclick="closeOverlay()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveShift()">保存</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// ★★★ ここだけ編集すればOK ★★★
// ============================================================

// 【1】GAS URL
const GAS_URL = 'https://script.google.com/macros/s/AKfycbycQ7FZHI2JwvQ_tx0ROubzLZJP_irKH9pDk18Xw1IlrdJ130D-4DerT4FsEuc4o75g/exec';

// 【2】スタッフ一覧（追加・削除はここ）
const STAFF_NAMES = [
  '100 森 徹',
  '119 鈴村のあ',
  '122 長谷川佐和子',
  '123 大道心温',
  '124 木林美鈴',
  '126 櫻井優来',
  '134 徳田紀子',
  '135 田茂井彩乃',
  '500 小松恵子',
  // ↑ 名前を追加するときはここにカンマで区切って追加
];

// 【3】提出期限（YYYY-MM-DD形式で変更）
function getDeadline() { return '2025-06-15'; }

// 【4】シフト一覧（追加・削除はここ）
// 形式: {name:'シフト名', time:'時間帯', note:'補足', color:'色コード'}
// 色: 青#3B82F6 緑#10B981 赤#EF4444 紫#8B5CF6 オレンジ#F97316
const SHIFTS = [
  {name:'①平日',          time:'14:00〜18:15',              note:'4.25時間',        color:'#3B82F6'},
  {name:'①木曜日',        time:'13:30〜18:15',              note:'4.75時間',        color:'#6366F1'},
  {name:'②土曜全日',      time:'9:00〜17:00',               note:'8時間・休憩1h',   color:'#F59E0B'},
  {name:'③土曜/休暇午前', time:'8:30〜13:00 / 8:00〜13:00', note:'4.5〜5時間',     color:'#10B981'},
  {name:'④土曜/休暇午後', time:'13:00〜18:00 / 13:00〜18:15',note:'5〜5.25時間',   color:'#8B5CF6'},
  {name:'⑤長期終日A',     time:'9:45〜18:15',               note:'8.5時間・休憩1h', color:'#EF4444'},
  {name:'⑥長期終日B',     time:'8:00〜17:00',               note:'9時間・休憩1h',   color:'#EC4899'},
  {name:'⑦長期終日C',     time:'9:30〜17:30',               note:'8時間・休憩1h',   color:'#F97316'},
  {name:'⑧長期終日D',     time:'8:30〜17:30',               note:'9時間・休憩1h',   color:'#14B8A6'},
  {name:'⑨給食なし',      time:'11:00〜18:15',              note:'7.25時間・休憩45分', color:'#0EA5E9'},
  // ↑ 新しいシフトは「休み希望」の上に追加
  {name:'休み希望',        time:'',                          note:'',               color:'#94A3B8', isOff:true},
  // ↑「休み希望」は必ず最後に残してください
];

// ============================================================
// ★★★ ここより下は編集不要 ★★★
// ============================================================

// ============================================================
// ★★★ ここだけ編集すればOK ★★★
// ============================================================

// 【1】GAS URL（変更不要）


// 【2】スタッフ一覧（追加・削除はここ）

// 【3】提出期限（YYYY-MM-DD形式で変更）
function getDeadline() { return '2026-05-22'; }

// 【4】シフト一覧（追加・削除はここ）
// 形式: {name:'シフト名', time:'時間帯', note:'補足', color:'色コード'}

// ===== 状態 =====
let currentYear, currentMonth, selectedDay = null;
let shifts = {}, userName = '';
const ADMIN_PASS_KEY = 'adminPass';
const DEADLINE_KEY = 'shiftDeadline';

// ===== 初期化 =====
function init() {
  const next = new Date();
  next.setMonth(next.getMonth() + 1);
  currentYear = next.getFullYear();
  currentMonth = next.getMonth() + 1;
  updateMonthLabel();
  updateDeadlineBanner();
  renderStaffChips();
}

function getAdminPass() { return localStorage.getItem(ADMIN_PASS_KEY) || 'admin123'; }
function formatDeadline(d) { const dt = new Date(d); return dt.getFullYear() + '年' + (dt.getMonth()+1) + '月' + dt.getDate() + '日'; }
function getShiftColor(name) { const s = getActiveShifts().find(s => s.name === name); return s ? s.color : '#64748B'; }
function dateKey(y, m, d) { return y + '-' + String(m).padStart(2,'0') + '-' + String(d).padStart(2,'0'); }

// ===== スタッフ表示 =====
function renderStaffChips() {
  const c = document.getElementById('staffChips');
  const sel = document.getElementById('nameInput').value;
  const list = getActiveStaff();
  c.innerHTML = list.map(name =>
    '<div class="chip' + (sel===name?' active':'') + '" onclick="selectStaff(this,\'' + name + '\')" style="' + (sel===name?'background:var(--primary);border-color:var(--primary);color:white;':'') + 'font-size:15px;padding:10px 16px">' + name + '</div>'
  ).join('');
}

function selectStaff(el, name) {
  document.querySelectorAll('#staffChips .chip').forEach(c => { c.classList.remove('active'); c.style.cssText = 'font-size:15px;padding:10px 16px'; });
  el.classList.add('active');
  el.style.cssText = 'background:var(--primary);border-color:var(--primary);color:white;font-size:15px;padding:10px 16px';
  document.getElementById('nameInput').value = name;
}

// ===== ステップ管理 =====
function setStep(n) {
  ['step1','step2','step3'].forEach((id,i) => { document.getElementById(id).style.display = i===n-1?'block':'none'; });
  for (let i=1;i<=3;i++) { document.getElementById('si'+i).className = 'step' + (i<n?' done':i===n?' active':''); }
}

function goHome() {
  if (document.getElementById('step1').style.display !== 'none') return;
  if (!confirm('入力中のデータは消えます。HOMEに戻りますか？')) return;
  shifts = {}; userName = '';
  document.getElementById('nameInput').value = '';
  document.getElementById('completeScreen').classList.remove('show');
  document.getElementById('sendStatus').innerHTML = '';
  setStep(1); renderStaffChips(); window.scrollTo(0,0);
}

function goStep1() { setStep(1); }

function goStep2() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) {
    const c = document.getElementById('staffChips');
    c.style.outline = '2px solid #EF4444'; c.style.borderRadius = '8px';
    setTimeout(() => { c.style.outline = ''; }, 1500);
    return;
  }
  userName = name; setStep(2);
  document.getElementById('calTitle').textContent = currentYear + '年' + currentMonth + '月';
  renderCalendar(); renderShiftList();
}

function goStep3() {
  if (Object.keys(shifts).length === 0) { alert('シフトを1日以上入力してください'); return; }
  setStep(3); renderConfirm();
}

function changeMonth(d) {
  currentMonth += d;
  if (currentMonth > 12) { currentMonth = 1; currentYear++; }
  if (currentMonth < 1) { currentMonth = 12; currentYear--; }
  updateMonthLabel();
  if (document.getElementById('step2').style.display !== 'none') { shifts = {}; renderCalendar(); renderShiftList(); }
}

function updateMonthLabel() { document.getElementById('monthLabel').textContent = currentYear + '年 ' + currentMonth + '月'; }

// ===== カレンダー =====
function renderCalendar() {
  const grid = document.getElementById('calGrid'); grid.innerHTML = '';
  const firstDay = new Date(currentYear, currentMonth-1, 1).getDay();
  const days = new Date(currentYear, currentMonth, 0).getDate();
  const today = new Date();
  for (let i=0;i<firstDay;i++) { const e=document.createElement('div'); e.className='cday'; grid.appendChild(e); }
  for (let d=1;d<=days;d++) {
    const date = new Date(currentYear, currentMonth-1, d);
    const dow = date.getDay();
    const key = dateKey(currentYear, currentMonth, d);
    const el = document.createElement('div');
    let cls = 'cday';
    if (dow===0) cls+=' sun'; if (dow===6) cls+=' sat';
    if (date.toDateString()===today.toDateString()) cls+=' today';
    if (shifts[key]) cls+=' has-shift';
    el.className = cls;
    el.innerHTML = '<span>' + d + '</span>';
    if (shifts[key]) {
      const dot = document.createElement('div');
      dot.className = 'dot';
      dot.style.background = getShiftColor(shifts[key].shift.split(' / ')[0]);
      el.appendChild(dot);
    }
    el.addEventListener('click', () => openSheet(d));
    grid.appendChild(el);
  }
  document.getElementById('badge').textContent = Object.keys(shifts).length + '日';
}

// ===== シフト入力モーダル =====
function openSheet(day) {
  selectedDay = day;
  const date = new Date(currentYear, currentMonth-1, day);
  const dow = WEEKDAYS[date.getDay()];
  const key = dateKey(currentYear, currentMonth, day);
  const existing = shifts[key];
  document.getElementById('sheetTitle').textContent = currentMonth + '月' + day + '日（' + dow + '）';
  document.getElementById('sheetSub').textContent = existing ? '✏️ 編集' : '➕ 新規';
  document.getElementById('noteInput').value = existing ? (existing.note||'') : '';
  document.getElementById('clearBtn').style.display = existing ? 'block' : 'none';
  renderShiftChipsModal(existing ? existing.shift : null);
  document.getElementById('overlay').classList.add('show');
}

function renderShiftChipsModal(selectedNames) {
  const arr = selectedNames ? selectedNames.split(' / ') : [];
  const c = document.getElementById('shiftChipsModal');
  c.innerHTML = getActiveShifts().map(s => {
    const isSel = arr.includes(s.name);
    return '<div class="chip' + (s.isOff?' off-chip':'') + (isSel?' active':'') + '" data-shift="' + s.name + '" onclick="selectShift(this)" style="' + (isSel?'background:'+s.color+';border-color:'+s.color+';color:white;':'border-color:'+s.color+'30;') + '">' + (s.isOff?'❌ ':'') + s.name + '</div>';
  }).join('');
  if (arr.length > 0) updateTimeDisplay(arr);
}

function selectShift(el) {
  const def = getActiveShifts().find(s => s.name === el.dataset.shift);
  const isOff = def && def.isOff;
  if (isOff) {
    document.querySelectorAll('#shiftChipsModal .chip').forEach(c => {
      const d = SHIFTS.find(s => s.name === c.dataset.shift);
      c.classList.remove('active'); c.style.background=''; c.style.borderColor=d?d.color+'30':''; c.style.color='';
    });
    el.classList.add('active'); el.style.background=def.color; el.style.borderColor=def.color; el.style.color='white';
    updateTimeDisplay(['休み希望']); return;
  }
  document.querySelectorAll('#shiftChipsModal .chip').forEach(c => {
    const d = SHIFTS.find(s => s.name === c.dataset.shift);
    if (d && d.isOff) { c.classList.remove('active'); c.style.background=''; c.style.borderColor=d.color+'30'; c.style.color=''; }
  });
  if (el.classList.contains('active')) {
    el.classList.remove('active'); el.style.background=''; el.style.borderColor=def?def.color+'30':''; el.style.color='';
  } else {
    el.classList.add('active'); if (def) { el.style.background=def.color; el.style.borderColor=def.color; el.style.color='white'; }
  }
  updateTimeDisplay(Array.from(document.querySelectorAll('#shiftChipsModal .chip.active')).map(a => a.dataset.shift));
}

function updateTimeDisplay(names) {
  const times = names.map(n => { const d=SHIFTS.find(s=>s.name===n); return d&&d.time?d.time:''; }).filter(t=>t);
  const el = document.getElementById('timeDisplay');
  el.innerHTML = times.length > 0 ? times.map(t=>'<span>'+t+'</span>').join('<span style="margin:0 4px">／</span>') : 'シフトを選択すると表示されます';
  el.style.color = times.length > 0 ? 'var(--primary)' : 'var(--text-sub)';
}

function saveShift() {
  const actives = document.querySelectorAll('#shiftChipsModal .chip.active');
  if (actives.length === 0) { alert('シフト区分を選択してください'); return; }
  const note = document.getElementById('noteInput').value;
  const key = dateKey(currentYear, currentMonth, selectedDay);
  const selected = Array.from(actives).map(el => { const d=SHIFTS.find(s=>s.name===el.dataset.shift); return {shift:el.dataset.shift,time:d?d.time:''}; });
  const hasOff = selected.some(s=>s.shift==='休み希望');
  const final = hasOff ? [{shift:'休み希望',time:''}] : selected;
  shifts[key] = { shift:final.map(s=>s.shift).join(' / '), time:final.map(s=>s.time).filter(t=>t).join(' / '), note };
  closeOverlay(); renderCalendar(); renderShiftList();
}

function clearDay() { const key=dateKey(currentYear,currentMonth,selectedDay); delete shifts[key]; closeOverlay(); renderCalendar(); renderShiftList(); }
function closeOverlay() { document.getElementById('overlay').classList.remove('show'); }

// ===== シフト一覧 =====
function renderShiftList() {
  const list = document.getElementById('shiftList');
  const keys = Object.keys(shifts).sort();
  if (keys.length === 0) { list.innerHTML='<div class="empty-msg">まだ入力されていません</div>'; return; }
  list.innerHTML = keys.map(key => {
    const d = parseInt(key.split('-')[2]);
    const date = new Date(currentYear, currentMonth-1, d);
    const dow = WEEKDAYS[date.getDay()];
    const s = shifts[key];
    const color = getShiftColor(s.shift.split(' / ')[0]);
    return '<div class="sitem"><div class="sdate">' + currentMonth + '/' + d + '(' + dow + ')</div><div class="sinfo"><div class="sname" style="color:' + color + '">' + s.shift + '</div><div class="stime">' + (s.time||(s.shift==='休み希望'?'休み':'')) + (s.note?' · '+s.note:'') + '</div></div><button class="sedit" onclick="openSheet(' + d + ')">✏️</button></div>';
  }).join('');
}

// ===== 確認画面 =====
function renderConfirm() {
  const keys = Object.keys(shifts).sort();
  document.getElementById('confirmContent').innerHTML =
    '<div style="background:var(--bg);border-radius:10px;padding:12px 14px;margin-bottom:12px"><div style="font-size:12px;color:var(--text-sub)">提出者</div><div style="font-size:16px;font-weight:700">' + userName + '</div><div style="font-size:12px;color:var(--text-sub);margin-top:4px">対象月</div><div style="font-size:15px;font-weight:700">' + currentYear + '年' + currentMonth + '月（' + keys.length + '日分）</div></div>' +
    keys.map(key => {
      const d=parseInt(key.split('-')[2]);
      const date=new Date(currentYear,currentMonth-1,d);
      const dow=WEEKDAYS[date.getDay()];
      const s=shifts[key];
      const color=getShiftColor(s.shift.split(' / ')[0]);
      return '<div class="sitem"><div class="sdate">' + currentMonth + '/' + d + '(' + dow + ')</div><div class="sinfo"><div class="sname" style="color:' + color + '">' + s.shift + '</div><div class="stime">' + (s.time||(s.shift==='休み希望'?'休み':'')) + (s.note?' · '+s.note:'') + '</div></div></div>';
    }).join('');
}

// ===== スプレッドシート送信 =====
async function sendToSheets() {
  const btn = document.getElementById('sheetsBtn');
  const status = document.getElementById('sendStatus');
  btn.disabled = true; btn.textContent = '⏳ 送信中...'; status.innerHTML = '';
  const keys = Object.keys(shifts).sort();
  const rows = keys.map(key => {
    const d = parseInt(key.split('-')[2]);
    const date = new Date(currentYear, currentMonth-1, d);
    const s = shifts[key];
    return { name:userName, date:currentYear+'/'+String(currentMonth).padStart(2,'0')+'/'+String(d).padStart(2,'0'), dow:WEEKDAYS[date.getDay()], shift:s.shift, time:s.time||(s.shift==='休み希望'?'休み':''), note:s.note||'' };
  });
  try {
    const res = await fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify({rows}) });
    const text = await res.text();
    if (text.includes('OK')) {
      document.getElementById('step3').style.display = 'none';
      document.getElementById('completeTitle').textContent = '送信完了！';
      document.getElementById('completeMsg').textContent = 'スプレッドシートにデータが登録されました。';
      document.getElementById('completeScreen').classList.add('show');
      document.getElementById('si3').className = 'step done';
    } else { throw new Error(text); }
  } catch(e) {
    status.innerHTML = '<span style="color:#EF4444">⚠️ 送信エラー。CSVで提出してください。</span>';
    btn.disabled = false; btn.textContent = '📊 スプレッドシートに送信';
  }
}

// ===== CSV =====
function downloadCSV() {
  const keys = Object.keys(shifts).sort();
  const rows = [['名前','日付','曜日','シフト区分','時間帯','備考'],
    ...keys.map(key => {
      const d=parseInt(key.split('-')[2]);
      const date=new Date(currentYear,currentMonth-1,d);
      const s=shifts[key];
      return [userName,currentYear+'/'+String(currentMonth).padStart(2,'0')+'/'+String(d).padStart(2,'0'),WEEKDAYS[date.getDay()],s.shift,s.time||(s.shift==='休み希望'?'休み':''),s.note||''];
    })
  ];
  const csv = '\uFEFF' + rows.map(r => r.map(v => '"'+v+'"').join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  a.download = 'シフト希望_' + userName + '_' + currentYear + String(currentMonth).padStart(2,'0') + '.csv';
  a.click();
}

// ===== 期限バナー =====
function updateDeadlineBanner() {
  const dl = getDeadline();
  const banner = document.getElementById('deadlineBanner');
  if (!dl) { banner.style.display='none'; return; }
  const deadline = new Date(dl); deadline.setHours(23,59,59);
  const diff = Math.ceil((deadline - new Date()) / (1000*60*60*24));
  banner.style.display = 'flex';
  if (diff < 0) { banner.style.cssText='display:flex;background:#FEE2E2;border-bottom:2px solid #EF4444;padding:10px 16px;font-size:13px;color:#991B1B;align-items:center;gap:8px'; banner.innerHTML='⚠️ 提出期限（'+formatDeadline(dl)+'）を過ぎています'; }
  else if (diff<=3) { banner.style.cssText='display:flex;background:#FEF3C7;border-bottom:2px solid #F59E0B;padding:10px 16px;font-size:13px;color:#92400E;align-items:center;gap:8px'; banner.innerHTML='⏰ 提出期限まであと '+diff+' 日（'+formatDeadline(dl)+'）'; }
  else { banner.style.cssText='display:flex;background:#F0FDF4;border-bottom:2px solid #10B981;padding:10px 16px;font-size:13px;color:#065F46;align-items:center;gap:8px'; banner.innerHTML='✅ 提出期限: '+formatDeadline(dl)+'（あと '+diff+' 日）'; }
}

// ===== 管理者 =====
// ===== スタッフ管理 =====
const STAFF_KEY = 'staffList';
const SHIFT_KEY = 'shiftList';
const SHIFT_COLORS = ['#3B82F6','#6366F1','#F59E0B','#10B981','#8B5CF6','#EF4444','#EC4899','#F97316','#14B8A6','#0EA5E9'];

function loadStaffList() {
  try { return JSON.parse(localStorage.getItem(STAFF_KEY)) || STAFF_NAMES; }
  catch { return STAFF_NAMES; }
}
function saveStaffToStorage(list) { localStorage.setItem(STAFF_KEY, JSON.stringify(list)); }
function loadShiftList() {
  try { return JSON.parse(localStorage.getItem(SHIFT_KEY)) || SHIFTS; }
  catch { return SHIFTS; }
}
function saveShiftToStorage(list) { localStorage.setItem(SHIFT_KEY, JSON.stringify(list)); }

function getActiveStaff() { return loadStaffList(); }
function getActiveShifts() { return loadShiftList(); }

function renderAdminStaffList() {
  const list = loadStaffList();
  const el = document.getElementById('adminStaffList');
  if (list.length === 0) { el.innerHTML = '<div style="font-size:12px;color:var(--text-sub);padding:8px 0">まだ登録されていません</div>'; return; }
  el.innerHTML = list.map((name, i) =>
    '<div style="display:flex;align-items:center;padding:8px 10px;background:var(--bg);border-radius:8px;margin-bottom:6px">' +
    '<span style="flex:1;font-size:14px;font-weight:700">👤 ' + name + '</span>' +
    '<button onclick="removeStaff(' + i + ')" style="background:none;border:none;color:#EF4444;font-size:18px;cursor:pointer">🗑</button>' +
    '</div>'
  ).join('');
}

function addStaff() {
  const input = document.getElementById('newStaffName');
  const name = input.value.trim();
  if (!name) return;
  const list = loadStaffList();
  if (list.includes(name)) { alert('同じ名前がすでに登録されています'); return; }
  list.push(name);
  saveStaffToStorage(list);
  renderAdminStaffList();
  renderStaffChips();
  input.value = '';
}

function removeStaff(i) {
  const list = loadStaffList();
  if (!confirm(list[i] + ' を削除しますか？')) return;
  list.splice(i, 1);
  saveStaffToStorage(list);
  renderAdminStaffList();
  renderStaffChips();
}

function renderAdminShiftList() {
  const list = loadShiftList();
  const el = document.getElementById('adminShiftList');
  el.innerHTML = list.filter(s => !s.isOff).map((s, i) =>
    '<div style="display:flex;align-items:center;padding:8px 10px;background:var(--bg);border-radius:8px;margin-bottom:6px">' +
    '<div style="width:10px;height:10px;border-radius:50%;background:' + s.color + ';flex-shrink:0;margin-right:8px"></div>' +
    '<div style="flex:1"><div style="font-size:13px;font-weight:700">' + s.name + '</div>' +
    '<div style="font-size:11px;color:var(--text-sub)">' + s.time + (s.note ? ' · ' + s.note : '') + '</div></div>' +
    '<button onclick="removeShift(' + i + ')" style="background:none;border:none;color:#EF4444;font-size:18px;cursor:pointer">🗑</button>' +
    '</div>'
  ).join('');
}

function addShift() {
  const name = document.getElementById('newShiftName').value.trim();
  const time = document.getElementById('newShiftTime').value.trim();
  const note = document.getElementById('newShiftNote').value.trim();
  if (!name) { alert('シフト名を入力してください'); return; }
  const list = loadShiftList();
  const color = SHIFT_COLORS[list.filter(s=>!s.isOff).length % SHIFT_COLORS.length];
  const offIdx = list.findIndex(s => s.isOff);
  if (offIdx >= 0) { list.splice(offIdx, 0, {name, time, note, color}); }
  else { list.push({name, time, note, color}); }
  saveShiftToStorage(list);
  renderAdminShiftList();
  document.getElementById('newShiftName').value = '';
  document.getElementById('newShiftTime').value = '';
  document.getElementById('newShiftNote').value = '';
}

function removeShift(i) {
  const list = loadShiftList();
  if (!confirm(list[i].name + ' を削除しますか？')) return;
  list.splice(i, 1);
  saveShiftToStorage(list);
  renderAdminShiftList();
}

function openAdmin() { document.getElementById('adminLogin').style.display='block'; document.getElementById('adminPanel').style.display='none'; document.getElementById('adminPass').value=''; document.getElementById('adminOverlay').classList.add('show'); }
function closeAdminPanel() { document.getElementById('adminOverlay').classList.remove('show'); }
function checkAdminPass() {
  if (document.getElementById('adminPass').value === getAdminPass()) {
    document.getElementById('adminLogin').style.display='none'; document.getElementById('adminPanel').style.display='block';
    const dl=getDeadline(); if(dl){document.getElementById('deadlineInput').value=dl;document.getElementById('currentDeadline').textContent='現在の期限: '+formatDeadline(dl);}
    renderAdminStaffList(); renderAdminShiftList();
  } else { document.getElementById('adminPass').style.borderColor='#EF4444'; setTimeout(()=>{document.getElementById('adminPass').style.borderColor='';},1500); }
}
function saveDeadline() { const v=document.getElementById('deadlineInput').value; if(!v)return; localStorage.setItem(DEADLINE_KEY,v); document.getElementById('currentDeadline').textContent='現在の期限: '+formatDeadline(v); updateDeadlineBanner(); alert('期限を保存しました'); }

// ===== PDF =====

v class="il"><label>未入力</label><span>'+(days-keys.length)+' 日</span></div></div><div style="margin-bottom:10px">'+summary+'</div><table><thead><tr><th class="sun">日</th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th class="sat">土</th></tr></thead><tbody><tr>'+cells+'</tr></tbody></table><div class="ft"><span>※シフト希望提出アプリで作成</span><span>'+userName+' / '+currentYear+'年'+currentMonth+'月</span></div></body></html>';
